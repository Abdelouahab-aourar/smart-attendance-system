[package]
name = "smart-attendance-system"
version = "1.0.0"
description = "Smart Attendance System is a desktop application that automates classroom attendance using facial recognition technology. Instead of manually calling student names or signing attendance sheets, the system recognizes registered students through a webcam and records their attendance automatically.The application also provides an administrative interface for managing student profiles and reviewing attendance records, making the attendance process faster, more accurate, and easier to manage. All information is stored locally on the user's computer, allowing the system to operate without relying on cloud services."
authors = ["Aourar-Abdelouahab"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "smart_attendance_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
dirs-next = "2.0.0"
base64 = "0.22"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"

